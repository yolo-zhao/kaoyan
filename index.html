<script>
(function(){
"use strict";
var HEAVY=["新课","看书","视频","大题"];
var PRIW={high:3,mid:2,low:1};
var TABS=[{k:"setup",n:"基础信息设置"},{k:"sched",n:"课表管理"},{k:"mats",n:"资料库"},{k:"plan",n:"每周规划"},{k:"today",n:"每日任务&打卡"},{k:"review",n:"复盘记录"}];

function T(s){if(!s)return 0;var a=String(s).split(":");return (+a[0])*60+(+(a[1]||0));}
function M(m){m=Math.max(0,Math.round(m));return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2);}
function fmtH(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;return h+"h"+(r?r+"m":"");}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function addDays(ds,n){var d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function dow(ds){var d=new Date(ds+"T00:00:00").getDay();return d===0?7:d;}
function monday(ds){return addDays(ds,1-dow(ds));}
function uid(){return Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}

function dfs(){
  return {
    cfg:{dayStart:"07:00",dayEnd:"23:00",lunchS:"12:00",lunchE:"13:30",buffer:0.8,revRatio:0.3,rate:1.0,examStart:"",examEnd:"",load:1.0},
    courses:[
      {id:"c1",name:"高等数学A",day:1,s:"08:00",e:"09:40",kind:"class"},
      {id:"c2",name:"大学物理实验",day:3,s:"14:00",e:"15:40",kind:"lab"},
      {id:"c3",name:"固定娱乐（运动/剧）",day:6,s:"19:00",e:"21:00",kind:"fun"}
    ],
    mats:[
      {id:"m1",name:"高数强化 第3讲 中值定理",subject:"数学",type:"视频",range:"第3讲 P45-58",est:80,diff:"中",pri:"high",cat:"考研",done:0,raw:120,speed:1.5},
      {id:"m2",name:"英语一 2019 Text1-2",subject:"英语",type:"习题",range:"真题 P12-15",est:40,diff:"中",pri:"mid",cat:"考研",done:0},
      {id:"m3",name:"马原 第2章 唯物辩证法",subject:"政治",type:"看书",range:"P30-48",est:60,diff:"低",pri:"low",cat:"考研",done:0}
    ],
    tasks:[],mistakes:[],reviews:[],stages:{}
  };
}
var S=dfs();
function save(){/* 沙箱预览态：数据留在当前会话内存，可导出备份 */}
var tab="setup",lastPlan=null,carryRev={},carryNew={},clearArmed=false,armedTimer=null;
var VIEWS={setup:vSetup,sched:vSched,mats:vMats,plan:vPlan,today:vToday,review:vReview};

/* ================= 调度引擎 ================= */
function dayBlocks(d){
  var st=T(S.cfg.dayStart),en=T(S.cfg.dayEnd);
  var busy=S.courses.filter(function(c){return +c.day===+d;})
    .map(function(c){return {s:T(c.s),e:T(c.e)};})
    .sort(function(a,b){return a.s-b.s;});
  var free=[],cur=st;
  busy.forEach(function(b){if(b.s>cur)free.push([cur,Math.min(b.s,en)]);if(b.e>cur)cur=b.e;});
  if(cur<en)free.push([cur,en]);
  var ls=T(S.cfg.lunchS),le=T(S.cfg.lunchE);
  return free.filter(function(f){return f[1]-f[0]>=20;}).map(function(f){
    var ov=Math.max(0,Math.min(f[1],le)-Math.max(f[0],ls));
    return {start:f[0],end:f[1],dur:f[1]-f[0],lunch:ov>=25};
  });
}
function splitBlock(b){
  var out=[],cur=b.start,contig=0;
  while(b.end-cur>=20){
    if(contig>=90){
      var r=Math.min(10,b.end-cur-15);
      if(r>0){out.push({start:cur,end:cur+r,rest:true,long:false});cur+=r;}
      contig=0;
      if(b.end-cur<20)break;
    }
    var cap=Math.min(b.end-cur,45);
    out.push({start:cur,end:cur+cap,long:b.dur>=60,light:!!b.lunch,rest:false});
    cur+=cap;contig+=cap;
  }
  return out;
}
function dayCapOf(d){
  var free=dayBlocks(d).reduce(function(s,x){return s+x.dur;},0);
  return Math.floor(free*S.cfg.buffer*S.cfg.load);
}
function weekCap(){
  var st=monday(today()),t=0;
  for(var i=0;i<7;i++)t+=dayCapOf(dow(addDays(st,i)));
  return t;
}
function nearExam(){
  if(!S.cfg.examStart)return 0;
  var d=diffDays(today(),S.cfg.examStart);
  return (d>=-3&&d<=14)?1:0;
}
function sc(p){
  var s=PRIW[p.pri]*10;
  if(p.cat==="期末")s+=15;
  if(p.kind==="review")s+=8;
  if(p.type==="错题")s+=4;
  if(nearExam()){if(p.cat==="期末")s+=22;else s-=8;}
  return s;
}
function stageOf(mid){return S.stages[mid]||{i:0,last:null};}
function taskPool(){
  var pool=[],E=[1,2,4,7,15],td=today();
  S.mats.forEach(function(m){
    var est=Math.max(15,Math.round(m.est*S.cfg.rate));
    if(m.done<100){
      pool.push({mid:m.id,title:m.name,subject:m.subject,kind:"new",type:m.type,cat:m.cat,pri:m.pri,
        est:Math.max(15,Math.round(est*(1-m.done/100))),range:m.range});
    }
    var st=stageOf(m.id);
    if(st.last){
      var gap=E[Math.min(st.i,E.length-1)];
      if(diffDays(st.last,td)>=gap)
        pool.push({mid:m.id,title:"艾宾浩斯复习 · "+m.name,subject:m.subject,kind:"review",type:"复习",
          cat:m.cat,pri:"mid",est:Math.max(10,Math.round(m.est*0.25)),range:m.range});
    }
  });
  S.mistakes.forEach(function(x){
    if(x.done)return;
    if(!x.next||diffDays(today(),x.next)>=0)
      pool.push({mid:"mk"+x.id,title:"错题复习 · "+x.kp,subject:x.subject,kind:"review",type:"错题",
        cat:"考研",pri:x.wrong>=2?"high":"mid",est:15,range:x.book+" P"+x.page});
  });
  return pool.sort(function(a,b){return sc(b)-sc(a);});
}
function buildPlan(){
  var start=monday(today()),days=[],totalCap=0;
  for(var i=0;i<7;i++){
    var date=addDays(start,i),d=dow(date),blocks=dayBlocks(d);
    var free=blocks.reduce(function(s,b){return s+b.dur;},0);
    var cap=Math.floor(free*S.cfg.buffer*S.cfg.load);
    days.push({date:date,d:d,blocks:blocks,cap:cap});
    totalCap+=cap;
  }
  var pool=taskPool();
  var demand=pool.reduce(function(s,p){return s+p.est;},0);
  var deferred=[];
  while(pool.length&&pool.reduce(function(s,p){return s+p.est;},0)>totalCap){
    pool.sort(function(a,b){return sc(a)-sc(b);});
    deferred.push(pool.shift());
  }
  pool.sort(function(a,b){return sc(b)-sc(a);});
  var qNew=pool.filter(function(p){return p.kind==="new";});
  var qRev=pool.filter(function(p){return p.kind==="review";});
  var tasks=[];
  days.forEach(function(day){
    var slots=[];
    day.blocks.forEach(function(b){splitBlock(b).forEach(function(s){s.cur=s.start;slots.push(s);});});
    slots.sort(function(a,b){return a.start-b.start;});
    var newBudget=Math.round(day.cap*(1-S.cfg.revRatio));
    var revBudget=day.cap-newBudget;
    function place(item,remaining,heavy){
      var order=slots.filter(function(s){return !s.rest&&s.end-s.cur>=10;});
      order.sort(function(a,b){
        var la=a.long?1:0,lb=b.long?1:0;
        if(heavy)return lb-la||(b.end-b.cur)-(a.end-a.cur);
        return la-lb||(b.end-b.cur)-(a.end-a.cur);
      });
      for(var i=0;i<order.length;i++){
        var s=order[i];
        if(heavy&&!s.long)continue;
        var room=s.end-s.cur;
        if(room<10)continue;
        if(heavy&&room<20)continue;
        var take=Math.min(room,remaining);
        if(take<10)continue;
        tasks.push({id:uid(),date:day.date,mid:item.mid,title:item.title,subject:item.subject,
          kind:item.kind,type:item.type,cat:item.cat,pri:item.pri,range:item.range,
          start:s.cur,end:s.cur+take,est:take,heavy:!!heavy,status:"none",actual:0,frag:!s.long,rest:false});
        s.cur+=take;remaining-=take;
        if(remaining<=0)return 0;
      }
      return remaining;
    }
    qRev.forEach(function(it){
      var rem=carryRev[it.mid]||it.est;
      if(rem<=0||revBudget<=0)return;
      var before=rem;rem=place(it,rem,false);
      revBudget-=(before-rem);carryRev[it.mid]=rem;
    });
    qNew.forEach(function(it){
      var rem=carryNew[it.mid]||it.est;
      if(rem<=0||newBudget<=0)return;
      var before=rem;rem=place(it,rem,HEAVY.indexOf(it.type)>=0);
      newBudget-=(before-rem);carryNew[it.mid]=rem;
    });
    qRev.forEach(function(it){
      var rem=carryRev[it.mid];if(!rem||rem<=0)return;
      carryRev[it.mid]=place(it,rem,false);
    });
    qNew.forEach(function(it){
      var rem=carryNew[it.mid];if(!rem||rem<=0)return;
      carryNew[it.mid]=place(it,rem,HEAVY.indexOf(it.type)>=0);
    });
    // 把休息槽插进任务序列
    slots.forEach(function(s){
      if(s.rest)tasks.push({id:uid(),date:day.date,title:"休息",rest:true,start:s.start,end:s.end,est:s.end-s.start});
    });
  });
  tasks.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.start-b.start;});
  return {days:days,tasks:tasks,deferred:deferred,totalCap:totalCap,demand:demand};
}
function rebuildFromTasks(){
  var start=monday(today()),days=[],totalCap=0;
  for(var i=0;i<7;i++){
    var date=addDays(start,i),d=dow(date),blocks=dayBlocks(d);
    var cap=dayCapOf(d);
    days.push({date:date,d:d,blocks:blocks,cap:cap});totalCap+=cap;
  }
  return {days:days,tasks:S.tasks,deferred:[],totalCap:totalCap,demand:S.tasks.filter(function(t){return !t.rest;}).reduce(function(s,t){return s+t.est;},0)};
}

/* ================= 组件 ================= */
function card(t,b,tag){return '<div class="card"><h4>'+t+(tag?'<em>'+tag+'</em>':'')+'</h4>'+b+'</div>';}
function ptag(p){var m={high:["t-high","高"],mid:["t-mid","中"],low:["t-low","低"]};var x=m[p]||m.mid;return '<span class="tag '+x[0]+'">'+x[1]+'</span>';}
function ctag(c){return '<span class="tag '+(c==="期末"?"t-qm":"t-ky")+'">'+c+'</span>';}
function toast(msg){var el=document.getElementById("kytoast");el.textContent=msg;el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity=0;},2400);}

/* ================= 页面 ================= */
function vSetup(){
  var h='<div class="grid2">';
  h+=card("作息与容量",
    "<div class='row'><span>起床时间</span><span class='rv'><input type='time' data-k='cfg.dayStart' value='"+S.cfg.dayStart+"'></span></div>"
    +"<div class='row'><span>最晚结束（23:00 硬上限）</span><span class='rv'><input type='time' max='23:00' data-k='cfg.dayEnd' value='"+S.cfg.dayEnd+"'></span></div>"
    +"<div class='row'><span>午休开始</span><span class='rv'><input type='time' data-k='cfg.lunchS' value='"+S.cfg.lunchS+"'></span></div>"
    +"<div class='row'><span>午休结束</span><span class='rv'><input type='time' data-k='cfg.lunchE' value='"+S.cfg.lunchE+"'></span></div>"
    +"<div class='row'><span>每日缓冲（≤空闲×此比例）</span><span class='rv'><input type='number' step='0.05' min='0.5' max='1' data-k='cfg.buffer' value='"+S.cfg.buffer+"'></span></div>"
  ,"规则 3 / 9");

  h+=card("学习配比与负载",
    "<div class='row'><span>艾宾浩斯复习占比</span><span class='rv'><input type='number' step='0.05' min='0' max='0.6' data-k='cfg.revRatio' value='"+S.cfg.revRatio+"'></span></div>"
    +"<div class='row'><span>新内容占比（自动）</span><span class='rv'><b>"+Math.round((1-S.cfg.revRatio)*100)+"%</b></span></div>"
    +"<div class='row'><span>本周负载系数</span><span class='rv'><b>"+S.cfg.load.toFixed(2)+"</b> <button class='btn sm' data-act='unload'>一键降载 −20%</button></span></div>"
    +"<div class='row'><span>个人学习速率系数</span><span class='rv'><b>"+S.cfg.rate.toFixed(2)+"</b> <button class='btn sm' data-act='resetRate'>重置</button></span></div>"
    +"<div class='muted' style='margin-top:6px'>系数由打卡的实际耗时自动校准：&gt;1 表示实际比预估更慢，下次规划自动放宽。</div>"
  ,"规则 3 / 4 / 11 / 14");

  h+=card("期末 / 考研双线模式",
    "<div class='row'><span>期末考试周开始</span><span class='rv'><input type='date' data-k='cfg.examStart' value='"+(S.cfg.examStart||"")+"'></span></div>"
    +"<div class='row'><span>期末考试周结束</span><span class='rv'><input type='date' data-k='cfg.examEnd' value='"+(S.cfg.examEnd||"")+"'></span></div>"
    +"<div class='muted' style='margin-top:6px'>考试周前 14 天内自动上调【期末任务】权重、下调考研任务量；结束后自动回到考研为主。</div>"

/* ================= 复盘问答生成 ================= */
function makeQ(t){
  var src=(t.subject||"")+" · "+(t.range||t.title),q;
  if(t.type==="错题")q="这道错题（"+t.title+"）上次错在哪一步？正确思路的第一步是什么？";
  else if(t.kind==="review")q="不看资料，复述「"+t.title+"」的核心要点，能说出几个？";
  else if(t.type==="新课"||t.type==="视频")q="用自己的话讲一遍「"+t.title+"」的主线：它解决什么问题、关键结论是什么、推导哪一步最容易卡？";
  else if(t.type==="大题")q="「"+t.title+"」这道大题的破题第一步是什么？题眼在哪个条件上？";
  else if(t.type==="看书")q="「"+t.title+"」这一节出现了哪几个关键定义？各举一个例子。";
  else if(t.type==="背诵")q="闭眼复述「"+t.title+"」的三个要点，说不出的立刻标出来。";
  else q="「"+t.title+"」做错的题属于哪类题型？同类题的通用解法是什么？";
  return {q:q,t:t.type+(t.kind==="review"?"·复习":""),src:src,a:""};
}

/* ================= 动作 ================= */
var ACT={
  go:function(id){tab=id;render();},
  addCourse:function(){
    var n=document.getElementById("cName").value.trim();
    if(!n){toast("先填名称");return;}
    S.courses.push({id:uid(),name:n,day:+document.getElementById("cDay").value,
      s:document.getElementById("cS").value,e:document.getElementById("cE").value,
      kind:document.getElementById("cKind").value});
    render();toast("已添加固定时段");
  },
  delCourse:function(id){S.courses=S.courses.filter(function(c){return c.id!==id;});render();},
  addMat:function(){
    var n=document.getElementById("mName").value.trim();
    if(!n){toast("先填资料名称");return;}
    var raw=+document.getElementById("mRaw").value||0;
    var sp=+document.getElementById("mSpeed").value||1;
    var est=+document.getElementById("mEst").value||0;
    if(raw>0)est=Math.ceil(raw/sp);
    if(!est)est=30;
    S.mats.push({id:uid(),name:n,subject:document.getElementById("mSub").value||"未分类",
      type:document.getElementById("mType").value,range:document.getElementById("mRange").value,
      est:est,diff:document.getElementById("mDiff").value,pri:document.getElementById("mPri").value,
      cat:document.getElementById("mCat").value,done:0,raw:raw,speed:sp});
    render();toast("已入库，预估 "+est+" 分钟");
  },
  delMat:function(id){S.mats=S.mats.filter(function(m){return m.id!==id;});render();},
  matDone:function(id){var m=S.mats.filter(function(x){return x.id===id;})[0];if(m){m.done=100;render();}},
  genPlan:function(){
    carryRev={};carryNew={};
    S.tasks=S.tasks.filter(function(t){return t.status&&t.status!=="none";});
    lastPlan=buildPlan();
    S.tasks=lastPlan.tasks.concat(S.tasks);
    tab="plan";render();
    toast("已生成 7 天计划"+(lastPlan.deferred.length?"，延后 "+lastPlan.deferred.length+" 项":""));
  },
  log:function(id,btn){
    var t=S.tasks.filter(function(x){return x.id===id;})[0];
    if(!t)return;
    var inp=document.getElementById("act-"+id);
    var act=+((inp&&inp.value)||t.est)||t.est;
    t.status=btn.dataset.st;t.actual=act;
    if(t.status!=="miss"&&act>0){
      var r=act/Math.max(10,t.est);
      S.cfg.rate=Math.min(2,Math.max(0.6,+(S.cfg.rate*0.8+r*0.2).toFixed(3)));
    }
    var m=S.mats.filter(function(x){return x.id===t.mid;})[0];
    if(m){
      var add=t.status==="done"?100:t.status==="part"?50:0;
      m.done=Math.min(100,(m.done||0)+add*(t.est/Math.max(20,m.est)));
      if(m.done>=99)S.stages[m.id]={i:(stageOf(m.id).i||0)+1,last:today()};
    }
    render();
    toast(t.status==="done"?"已打卡 · 速率系数更新为 "+S.cfg.rate.toFixed(2):"已记录");
  },
  unload:function(){
    S.cfg.load=Math.max(0.6,+(S.cfg.load-0.2).toFixed(2));
    lastPlan=null;render();toast("本周负载已降至 "+S.cfg.load.toFixed(2)+"，重新生成后生效");
  },
  resetRate:function(){S.cfg.rate=1;render();toast("速率系数已重置为 1.00");},
  export:function(){
    var box=document.getElementById("ioBox");
    box.value=JSON.stringify(S);
    try{
      var b=new Blob([box.value],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(b);a.download="kaoyan-backup-"+today()+".json";
      document.body.appendChild(a);a.click();a.remove();
    }catch(e){}
    toast("已导出到备份框（也可复制保存）");
  },
  import:function(){
    var v=document.getElementById("ioBox").value.trim();
    if(!v){toast("备份框是空的");return;}
    try{
      var o=JSON.parse(v);
      var base=dfs();
      Object.keys(base).forEach(function(k){if(o[k]!==undefined)base[k]=o[k];});
      S=base;lastPlan=null;render();toast("数据已恢复");
    }catch(e){toast("JSON 解析失败，请检查是否粘贴完整");}
  },
  demo:function(){S=dfs();lastPlan=null;render();toast("已载入示例数据");},
  clear:function(){
    if(!clearArmed){
      clearArmed=true;
      clearTimeout(armedTimer);
      armedTimer=setTimeout(function(){clearArmed=false;if(tab==="setup")render();},4000);
      render();return;
    }
    clearArmed=false;
    S=dfs();S.courses=[];S.mats=[];S.tasks=[];S.reviews=[];S.mistakes=[];S.stages={};
    lastPlan=null;render();toast("已清空");
  },
  genQA:function(){
    var td=today();
    var ts=S.tasks.filter(function(t){return t.date===td&&!t.rest&&t.status&&t.status!=="none";});
    if(!ts.length){toast("今天还没有打卡任务，先打卡再来复盘");return;}
    var items=ts.map(makeQ);
    var old=S.reviews.filter(function(r){return r.date===td;})[0];
    if(old)old.items=items;else S.reviews.push({id:uid(),date:td,items:items});
    render();toast("已生成 "+items.length+" 个复盘问题");
  },
  saveQA:function(id){
    var rv=S.reviews.filter(function(r){return r.id===id;})[0];
    if(!rv)return;
    var nodes=document.querySelectorAll("[data-ans='"+id+"']");
    for(var i=0;i<nodes.length;i++){
      var idx=+nodes[i].dataset.i;
      if(rv.items[idx])rv.items[idx].a=nodes[i].value;
    }
    toast("复盘已保存");
  },
  addMk:function(){
    var kp=document.getElementById("kKp").value.trim();
    if(!kp){toast("先填知识点名称");return;}
    S.mistakes.push({id:uid(),subject:document.getElementById("kSub").value||"未分类",
      book:document.getElementById("kBook").value||"—",kp:kp,
      page:document.getElementById("kPage").value||"—",wrong:1,next:addDays(today(),1),done:false});
    render();toast("已录入，明天提醒复习");
  },
  mkAgain:function(id){
    var x=S.mistakes.filter(function(m){return m.id===id;})[0];
    if(x){x.wrong=(x.wrong||1)+1;x.next=addDays(today(),Math.max(1,Math.ceil(3/x.wrong)));render();
      toast("已标记薄弱点（第 "+x.wrong+" 次），复习频次提高");}
  },
  mkOk:function(id){
    var x=S.mistakes.filter(function(m){return m.id===id;})[0];
    if(x){x.next=addDays(today(),x.wrong>=2?2:4);render();toast("已掌握，下次复习 "+x.next);}
  },
  delMk:function(id){S.mistakes=S.mistakes.filter(function(m){return m.id!==id;});render();},
  voice:function(id,btn){
    var tgt=btn.dataset.target;
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast("当前浏览器不支持语音识别，请用 Chrome/Edge，或直接文字输入");return;}
    try{
      var r=new SR();r.lang="zh-CN";r.interimResults=false;
      btn.textContent="🎤 识别中…";
      r.onresult=function(e){
        var txt=e.results[0][0].transcript,el=document.getElementById(tgt);
        if(el)el.value=(el.value?el.value+" ":"")+txt;
      };
      r.onerror=function(){btn.textContent="🎤 语音";};
      r.onend=function(){btn.textContent="🎤 语音";};
      r.start();
    }catch(e){btn.textContent="🎤 语音";}
  }
};

/* ================= 渲染 ================= */
function head(){
  document.getElementById("kyhead").innerHTML=
    "<span class='hchip'>本周上限 <b>"+fmtH(weekCap())+"</b></span>"
    +"<span class='hchip'>速率 <b>"+S.cfg.rate.toFixed(2)+"</b></span>"
    +"<span class='hchip'>负载 <b>"+S.cfg.load.toFixed(2)+"</b></span>"
    +"<span class='hchip'>"+today()+" 周"+dow(today())+"</span>";
}
function render(){
  document.getElementById("kytabs").innerHTML=TABS.map(function(t){
    return "<button class='tab"+(tab===t.k?" on":"")+"' data-act='go' data-id='"+t.k+"'>"+t.n+"</button>";
  }).join("");
  document.getElementById("kyview").innerHTML=VIEWS[tab]();
  head();
}
document.getElementById("ky").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(!b)return;
  if(b.tagName==="SELECT"||b.tagName==="INPUT")return;
  var a=b.dataset.act;
  if(ACT[a]){e.preventDefault();ACT[a](b.dataset.id,b);}
});
document.getElementById("ky").addEventListener("change",function(e){
  var el=e.target,k=el.dataset.k;
  if(!k)return;
  var p=k.split("."),v=el.value;
  if(p[1]==="buffer"||p[1]==="revRatio"||p[1]==="load"||p[1]==="rate")v=+v;
  S[p[0]][p[1]]=v;
  head();
});
render();
})();
</script>
